name: Deploy Website

# Deploys the site to S3 and invalidates CloudFront on every push to main
# (normally a merged pull request from dev). Can also be run by hand from
# the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Nothing deploys unless the Playwright suite passes on the exact commit being deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Modules
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npm test

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install Modules
        run: npm ci

      - name: Build Application
        run: npm run build

      # Same three uploads as the README: unhashed files cache for a day,
      # hashed assets are immutable, index.html is never cached.
      - name: Deploy to S3
        run: |
          aws s3 sync dist s3://${{ secrets.BUCKET_NAME }} --delete --exclude "index.html" --exclude "assets/*" --cache-control "public, max-age=86400"
          aws s3 sync dist/assets s3://${{ secrets.BUCKET_NAME }}/assets --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html s3://${{ secrets.BUCKET_NAME }}/index.html --cache-control "no-cache"

      - name: Create CloudFront Invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
